<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Verify OTP | THE GOODY CO.</title>
    {% load static %}

<link rel="stylesheet" href="{% static 'css/login_otp.css' %}">

</head>

<body>

    <main>

        <h1>Verify Your Email</h1>

        <p>
            Enter the 6-digit OTP sent to
        </p>

        <strong>
            {{ email }}
        </strong>

        {% if messages %}

            {% for message in messages %}

                <div>
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}


        <form
            method="POST"
            action="{% url 'login_otp' %}"
        >

            {% csrf_token %}

            <label for="otp">
                Enter OTP
            </label>

            <input
                type="text"
                id="otp"
                name="otp"
                maxlength="6"
                minlength="6"
                inputmode="numeric"
                autocomplete="one-time-code"
                placeholder="000000"
                required
            >

            <button type="submit">
                Verify OTP
            </button>

        </form>


        <form
            method="POST"
            action="{% url 'resend_login_otp' %}"
        >

            {% csrf_token %}

            <button type="submit">
                Resend OTP
            </button>

        </form>


        <a href="{% url 'login' %}">
            Back to Login
        </a>

    </main>

</body>

</html>
