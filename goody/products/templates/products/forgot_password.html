
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password | THE GOODY CO.</title>

    {% load static %}

    <link
        rel="stylesheet"
        href="{% static 'css/forgot_password.css' %}"
    >

</head>

<body>

    <main class="auth-container">

        <section class="auth-card">

            <div class="brand">
                THE GOODY CO.
            </div>

            <div class="icon">
                🔐
            </div>

            <h1>
                Forgot Password?
            </h1>

            <p class="subtitle">
                Enter your registered email address and
                we'll send you a verification code.
            </p>

            {% if messages %}

                {% for message in messages %}

                    <div class="message {{ message.tags }}">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

            <form
                method="POST"
                action="{% url 'forgot_password' %}"
            >

                {% csrf_token %}

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

                <button type="submit">
                    Send OTP
                </button>

            </form>

            <a
                href="{% url 'login' %}"
                class="back-link"
            >
                ← Back to Login
            </a>

        </section>

    </main>

</body>

</html>
