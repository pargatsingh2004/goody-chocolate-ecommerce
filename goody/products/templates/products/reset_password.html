
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password | THE GOODY CO.</title>

    {% load static %}

    <link
        rel="stylesheet"
        href="{% static 'css/reset_password.css' %}"
    >

</head>

<body>

    <main class="auth-container">

        <section class="auth-card">

            <div class="brand">
                THE GOODY CO.
            </div>

            <div class="lock-icon">
                🔒
            </div>

            <h1>
                Create New Password
            </h1>

            <p class="subtitle">
                Set a new password for
            </p>

            <strong class="email">
                {{ email }}
            </strong>

            {% if messages %}

                {% for message in messages %}

                    <div class="message {{ message.tags }}">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

            <form
                method="POST"
                action="{% url 'reset_password' %}"
            >

                {% csrf_token %}

                <label for="password">
                    New Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter new password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm new password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

                <button type="submit">
                    Reset Password
                </button>

            </form>

            <a
                href="{% url 'login' %}"
                class="back-link"
            >
                ← Back to Login
            </a>

        </section>

    </main>

</body>

</html>
