
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Verify OTP | THE GOODY CO.</title>

    {% load static %}

    <link
        rel="stylesheet"
        href="{% static 'css/forgot_password_otp.css' %}"
    >

</head>

<body>

    <main class="auth-container">

        <section class="auth-card">

            <div class="brand">
                THE GOODY CO.
            </div>

            <div class="otp-icon">
                ✉
            </div>

            <h1>
                Verify OTP
            </h1>

            <p class="subtitle">
                Enter the 6-digit code sent to
            </p>

            <strong class="email">
                {{ email }}
            </strong>

            {% if messages %}

                {% for message in messages %}

                    <div class="message {{ message.tags }}">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

            <form
                method="POST"
                action="{% url 'forgot_password_otp' %}"
            >

                {% csrf_token %}

                <label for="otp">
                    Enter OTP
                </label>

                <input
                    type="text"
                    id="otp"
                    name="otp"
                    maxlength="6"
                    minlength="6"
                    pattern="[0-9]{6}"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    placeholder="000000"
                    required
                >

                <button type="submit">
                    Verify OTP
                </button>

            </form>

            <form
                method="POST"
                action="{% url 'resend_forgot_password_otp' %}"
            >

                {% csrf_token %}

                <button
                    type="submit"
                    class="resend-btn"
                >
                    Resend OTP
                </button>

            </form>

            <a
                href="{% url 'forgot_password' %}"
                class="back-link"
            >
                ← Change Email
            </a>

        </section>

    </main>

</body>

</html>
