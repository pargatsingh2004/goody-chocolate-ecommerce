{% extends "admin_panel/base.html" %}{% block title %}Coupon{% endblock %}{% block page_title %}{% if coupon %}Edit Coupon{% else %}Add Coupon{% endif %}{% endblock %}{% block content %}<div class="gd-card"><div class="gd-card-body"><form method="post">{% csrf_token %}<div class="row g-3"><div class="col-md-6"><label>Code</label><input class="form-control" name="code" required value="{{coupon.code|default:''}}"></div><div class="col-md-6"><label>Discount Type</label><select class="form-select" name="discount_type"><option value="percentage" {% if coupon.discount_type == 'percentage' %}selected{% endif %}>Percentage</option><option value="fixed" {% if coupon.discount_type == 'fixed' %}selected{% endif %}>Fixed Amount</option></select></div><div class="col-md-4"><label>Discount Value</label><input class="form-control" type="number" step="0.01" name="discount_value" required value="{{coupon.discount_value|default:''}}"></div><div class="col-md-4"><label>Minimum Order</label><input class="form-control" type="number" step="0.01" name="minimum_order" value="{{coupon.minimum_order|default:'0'}}"></div><div class="col-md-4"><label>Maximum Discount</label><input class="form-control" type="number" step="0.01" name="maximum_discount" value="{{coupon.maximum_discount|default:''}}"></div><div class="col-md-6"><label>Valid From</label><input class="form-control" type="datetime-local" name="valid_from" value="{% if coupon %}{{coupon.valid_from|date:'Y-m-d\TH:i'}}{% endif %}"></div><div class="col-md-6"><label>Valid Until</label><input class="form-control" type="datetime-local" name="valid_until" value="{% if coupon.valid_until %}{{coupon.valid_until|date:'Y-m-d\TH:i'}}{% endif %}"></div><div class="col-md-6"><label>Usage Limit</label><input class="form-control" type="number" name="usage_limit" value="{{coupon.usage_limit|default:''}}"></div><div class="col-md-6 d-flex align-items-end"><label class="form-check"><input class="form-check-input" type="checkbox" name="active" {% if not coupon or coupon.active %}checked{% endif %}> Active</label></div></div><button class="btn btn-gold mt-4">Save Coupon</button> <a class="btn btn-outline-light mt-4" href="{% url 'admin_coupons' %}">Cancel</a></form></div></div>{% endblock %}
