{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | THE GOODY CO.</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'admin_panel/css/admin.css' %}">
<style>
body { background: radial-gradient(circle at top, #241b16 0%, #100c0a 70%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div class="admin-login-wrap">
    <div class="admin-login-card">
        <div class="text-center mb-5">
            <img src="{% static 'images/logo.png' %}" alt="Logo" style="width:60px; height:60px; border-radius:12px; margin-bottom:15px;">
            <h2 style="color:#EFE6DA; font-weight:800;">THE GOODY CO.</h2>
            <p style="color:#9c8f83; font-size:14px; margin-bottom:0;">Admin Control Panel</p>
        </div>

        {% if messages %}
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
            </div>
            {% endfor %}
        {% endif %}

        <form method="post" class="gd-form">
            {% csrf_token %}
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username" autofocus required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>
            <div class="form-check mb-4">
                <input type="checkbox" id="remember" name="remember" class="form-check-input">
                <label class="form-check-label" for="remember">Remember me for 30 days</label>
            </div>
            <button type="submit" class="btn btn-gold btn-lg w-100 fw-bold mb-3">
                <i class="bi bi-box-arrow-in-right me-2"></i>Login
            </button>
        </form>

        <p style="text-align:center; color:#9c8f83; font-size:13px; margin-bottom:0;">
            Only staff members can access this panel.
        </p>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
