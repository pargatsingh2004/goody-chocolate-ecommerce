{% extends 'products/base.html' %}
{% load static %}
{% block title %}Reset Password | THE GOODY CO.{% endblock %}
{% block content %}
<section class="py-5 text-center text-white" style="background:#4E2A1E;">
    <div class="container">
        <h1 class="display-4 fw-bold">Reset Your Password</h1>
        <p>Enter your email and we'll send you a link to reset your password.</p>
    </div>
</section>
<section class="py-5">
<div class="container">
<div class="row justify-content-center">
<div class="col-lg-5">
<div class="card shadow-lg border-0">
<div class="card-body p-5">
<form method="post">
{% csrf_token %}
<div class="mb-3">
    <label class="form-label">Email Address</label>
    <input type="email" name="email" class="form-control" placeholder="Enter your registered email" required>
</div>
<button type="submit" class="btn btn-warning btn-lg w-100"><i class="bi bi-envelope-fill"></i> Send Reset Link</button>
<div class="text-center mt-4">
    <a href="{% url 'login' %}" class="fw-bold">Back to Login</a>
</div>
</form>
</div>
</div>
</div>
</div>
</div>
</section>
{% endblock %}
