{% load static %}<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block subject %}THE GOODY CO.{% endblock %}</title>

  </tr>

  <!-- Footer -->

      </p>

</table>
</td>
</tr>
</table>

</html>
